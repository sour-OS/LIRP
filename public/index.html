<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LIRP: Interview Cosplay</title>
<style>
:root{--bg:#0d1117;--card:#161b26;--ink:#f5f7fa;--muted:#9aa4b8;--accent:#ffcc00;--good:#3ddc97;--bad:#ff6b6b;--line:#2a3142;--soft:#1f2636}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:radial-gradient(circle at top,#1d2540,var(--bg) 60%);color:var(--ink);min-height:100vh;padding:24px}
.wrap{max-width:840px;margin:0 auto}
h1{font-size:2.3rem;margin:0 0 4px}
h2{font-size:1.3rem;margin:12px 0 8px}
h3{margin:0 0 6px;font-size:1.05rem}
.tag{color:var(--muted);margin:0 0 24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px}
.label{font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin:16px 0 6px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.costume{cursor:pointer;border:2px solid var(--line);background:var(--soft);border-radius:14px;padding:14px;color:var(--ink);text-align:left;font:inherit;margin:0}
.costume.sel{border-color:var(--accent)}
.costume .emoji{font-size:2rem;line-height:1.1}
.muted{color:var(--muted);font-size:.92rem}
.small{font-size:.85rem;color:var(--muted);margin-top:6px}
textarea,input[type=text]{width:100%;background:#0f131d;color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit}
textarea{min-height:140px;resize:vertical}
input[type=file]{color:var(--muted)}
input[type=checkbox]{width:16px;height:16px;margin:0}
button{background:var(--accent);color:#1a1400;border:0;border-radius:10px;padding:10px 16px;font-weight:700;font-size:.95rem;cursor:pointer;margin:6px 6px 0 0}
button:disabled{opacity:.6;cursor:default}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.bubble{background:var(--soft);padding:16px;border-radius:14px;line-height:1.5;font-size:1.05rem;border-left:4px solid var(--accent);margin:10px 0}
.score{font-size:2.6rem;font-weight:800;color:var(--accent);margin:8px 0 2px}
.good{color:var(--good);font-weight:600}
.bad{color:var(--bad);font-weight:600}
.error{color:var(--bad);margin-top:8px}
.hidden{display:none !important}
ul{margin:6px 0;padding-left:20px}
li{margin:6px 0;line-height:1.45}
.pill{display:inline-block;background:#2a2f40;border-radius:999px;padding:3px 10px;font-size:.85rem;margin:3px 4px 3px 0}
.letter{background:#fbf7ec;color:#222;padding:18px;border-radius:10px;font-family:Georgia,serif;white-space:pre-wrap;line-height:1.5;margin-top:10px}
.timer{font-variant-numeric:tabular-nums;font-weight:700;color:var(--accent);margin-top:8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toggle{display:flex;align-items:center;gap:8px;margin-top:14px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <h1>🎭 LIRP</h1>
  <p class="tag">Pick a costume, hand over your resume, and survive a practice interview with a character who has opinions.</p>

  <div id="intake" class="card">
    <h2>1. Pick your costume</h2>
    <div id="costumes" class="grid"></div>

    <div class="label">2. Upload your resume (PDF, TXT, or MD, max 4 MB)</div>
    <input id="resume" type="file" accept=".pdf,.txt,.md">
    <div id="resumeName" class="small"></div>

    <div class="label">3. Paste the job posting</div>
    <textarea id="posting" placeholder="Paste the full job description here..."></textarea>

    <div class="label">4. Company name (optional, used in your final letter)</div>
    <input id="company" type="text" placeholder="e.g. Shopify">

    <label class="toggle"><input id="pressure" type="checkbox"> Pressure mode: 90-second timer per answer</label>

    <div class="row"><button id="startBtn">Start the interview 🎬</button></div>
    <div id="intakeErr" class="error hidden"></div>
  </div>

  <div id="stage"></div>
</div>

<script>
const COSTUMES = [
  {
    id: 'founder', emoji: '🚀', name: 'Hype Founder',
    blurb: 'Says "we are basically a rocket ship." Everything is 10x.',
    voice: `An overcaffeinated startup founder. Says "crush it", "10x", and "disrupt" unironically. Judges everything by growth and hustle. Gets excited and interrupts.`,
    offer: `Dear Candidate,

WE ARE SO EXCITED. You have been selected to join {company} as our next Head of Everything. Bring the hustle. We have no snacks yet, but we have a vision.

Let's crush it,
The Founder`,
    reject: `Dear Candidate,

After a deep dive into your 10x potential, our growth curve was flat. We are pivoting away from you. Best of luck in your next rocket ship.

Sincerely,
The Founder, {company}`
  },
  {
    id: 'barraiser', emoji: '🧊', name: 'Cold Bar Raiser',
    blurb: 'Interrupts. Asks "why" three times. Never smiles.',
    voice: `A cold, precise senior interviewer who interrupts vague answers, asks "why" repeatedly, and wants evidence for every claim. Speaks in short sentences. Never gushes.`,
    offer: `Candidate,

Your answers were specific enough to be useful. We are extending an offer to join {company}. Please confirm by Friday.

Regards,
Bar Raiser`,
    reject: `Candidate,

Your answers were not supported by evidence. We have considered the matter and are not proceeding.

Regards,
Bar Raiser, {company}`
  },
  {
    id: 'friday', emoji: '😴', name: 'Friday 4:55 PM Recruiter',
    blurb: 'Wants answers under 30 seconds. Is thinking about dinner.',
    voice: `A tired recruiter at the end of a long week who is distracted and wants short, clear answers. Keeps glancing at the clock. Mildly impatient, but still curious when something is interesting.`,
    offer: `Hi Candidate!!

Good news, you're moving forward with {company}. Someone will send the real offer Monday. Have a great weekend!!

Bye,
Recruiter (typing from the parking lot)`,
    reject: `Hi Candidate,

Thanks for your time. Unfortunately we're going another direction. Have a great weekend.

Best,
Recruiter, {company}`
  },
  {
    id: 'sergeant', emoji: '🎖️', name: 'Drill Sergeant HR',
    blurb: 'STAR method or get out. Now. Move.',
    voice: `A drill sergeant who runs interviews like boot camp. Demands structure (situation, task, action, result). Barks follow-ups. Respects discipline and punishes rambling.`,
    offer: `CANDIDATE,

You passed the drill. You will report to {company} at 0600 hours with a pen, a notebook, and no excuses.

Dismissed,
Sergeant`,
    reject: `CANDIDATE,

You did not meet standard. Your answers were a rambling mess. Go home, do one more STAR story, and reapply.

Sergeant, {company}`
  },
  {
    id: 'auntie', emoji: '👵', name: 'Nosy Auntie HR',
    blurb: 'Wants to know your hobbies, your mom, and why you are not on LinkedIn.',
    voice: `A warm, nosy HR manager who asks personal-sounding questions about teamwork, hobbies, and how you handle conflict. Very kind, slightly intimidating, and always circles back to the job.`,
    offer: `Dearest Candidate,

We loved you! Everyone in the office is talking about your answers. Welcome to {company}. Please bring a cake on your first day.

With love,
Auntie HR`,
    reject: `Dearest Candidate,

We think you are a lovely person, truly. But we are going with someone else. Please call your mother and tell her we said hello.

With love,
Auntie HR, {company}`
  }
];

const BUZZWORDS = [
  'synergy', 'leverage', 'impact', 'ownership', 'cross-functional', 'stakeholder',
  'scalable', 'passionate', 'results-driven', 'team player', 'fast-paced', 'innovative',
  'end-to-end', 'data-driven', 'collaborate', 'proactive', 'go-getter', 'thought leader'
];

const $ = id => document.getElementById(id);
const stage = $('stage');
const MAX_FILE = 4 * 1024 * 1024;
let costumeId = COSTUMES[0].id;
let state = null;
let timerId = null;

const el = (tag, cls, text) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
};

const currentCostume = () => COSTUMES.find(c => c.id === costumeId);

function renderCostumes() {
  const wrap = $('costumes');
  wrap.innerHTML = '';
  COSTUMES.forEach(c => {
    const b = el('button', 'costume' + (c.id === costumeId ? ' sel' : ''));
    b.type = 'button';
    b.appendChild(el('div', 'emoji', c.emoji));
    b.appendChild(el('h3', '', c.name));
    b.appendChild(el('div', 'muted', c.blurb));
    b.onclick = () => { costumeId = c.id; renderCostumes(); };
    wrap.appendChild(b);
  });
}

function showErr(msg) {
  const box = $('intakeErr');
  box.textContent = msg;
  box.classList.remove('hidden');
}

function guessMime(name) {
  const n = name.toLowerCase();
  if (n.endsWith('.pdf')) return 'application/pdf';
  if (n.endsWith('.md')) return 'text/markdown';
  return 'text/plain';
}

function readResume(file) {
  return new Promise((resolve, reject) => {
    if (!file) return resolve(null);
    if (file.size > MAX_FILE) return reject(new Error('Resume is over 4 MB. Export a smaller PDF.'));
    const reader = new FileReader();
    reader.onload = () => resolve({
      name: file.name,
      mimeType: guessMime(file.name),
      data: String(reader.result).split(',')[1]
    });
    reader.onerror = () => reject(new Error('Could not read the resume file.'));
    reader.readAsDataURL(file);
  });
}

async function post(url, body) {
  const res = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || 'Something went wrong. The interviewer is on break.');
  return data;
}

function buzzHits(text) {
  const t = text.toLowerCase();
  return BUZZWORDS.filter(w => new RegExp('\\b' + w + '\\b').test(t));
}

function clearTimer() {
  if (timerId) {
    clearInterval(timerId);
    timerId = null;
  }
}

$('resume').addEventListener('change', e => {
  const f = e.target.files[0];
  $('resumeName').textContent = f ? 'Selected: ' + f.name : '';
});

$('startBtn').onclick = async () => {
  $('intakeErr').classList.add('hidden');
  const posting = $('posting').value.trim();

  if (posting.length < 80) {
    showErr('That is not a job posting, that is a sticky note. Paste the full description.');
    return;
  }

  const btn = $('startBtn');
  btn.disabled = true;
  btn.textContent = 'Reading your resume and the posting...';

  try {
    const resume = await readResume($('resume').files[0]);
    const prep = await post('/api/prep', { posting, resume, costume: currentCostume().voice });

    state = {
      posting,
      company: $('company').value.trim(),
      hasResume: !!resume,
      costume: currentCostume(),
      prep,
      questions: prep.questions,
      idx: 0,
      scores: [],
      pressure: $('pressure').checked
    };
    renderPrep();
  } catch (e) {
    showErr(e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = 'Start the interview 🎬';
  }
};

function renderPrep() {
  const p = state.prep;
  stage.innerHTML = '';
  const card = el('div', 'card');

  card.appendChild(el('div', 'muted', 'Interviewer: ' + state.costume.emoji + ' ' + state.costume.name));
  card.appendChild(el('div', 'bubble', p.opener));

  card.appendChild(el('div', 'label', 'Fit score'));
  card.appendChild(el('div', 'score', p.fit + ' / 100'));
  card.appendChild(el('p', '', p.summary));

  card.appendChild(el('div', 'label', 'Resume glow-up (reframes what you already did)'));
  if (p.glowUp.length) {
    const ul = el('ul');
    p.glowUp.forEach(g => {
      const li = el('li');
      li.appendChild(el('strong', '', g.section + ': '));
      li.appendChild(document.createTextNode(g.suggestion + (g.verifyFirst ? ' (confirm this is true before using it)' : '')));
      ul.appendChild(li);
    });
    card.appendChild(ul);
  } else {
    card.appendChild(el('p', 'muted', state.hasResume
      ? 'No changes suggested. Your resume already sounds like you did things.'
      : 'Upload a resume next time to get glow-up tips.'));
  }

  if (p.keywords.length) {
    card.appendChild(el('div', 'label', 'Posting keywords (only use the ones that are true of you)'));
    const box = el('div');
    p.keywords.forEach(k => box.appendChild(el('span', 'pill', k)));
    card.appendChild(box);
  }

  if (p.tips.length) {
    card.appendChild(el('div', 'label', 'Interview tips'));
    const ul = el('ul');
    p.tips.forEach(t => ul.appendChild(el('li', '', t)));
    card.appendChild(ul);
  }

  const go = el('button', '', 'Begin the interview →');
  go.onclick = () => {
    state.idx = 0;
    state.scores = [];
    renderQuestion();
  };
  card.appendChild(go);

  stage.appendChild(card);
  card.scrollIntoView({ behavior: 'smooth' });
}

function renderQuestion() {
  clearTimer();
  stage.innerHTML = '';
  const q = state.questions[state.idx];
  const card = el('div', 'card');

  card.appendChild(el('div', 'muted', `${state.costume.name} · Question ${state.idx + 1} of ${state.questions.length}`));
  card.appendChild(el('div', 'bubble', q));

  const answer = el('textarea');
  answer.placeholder = 'Answer in character. Be specific. Be brave. Be at least somewhat true.';
  const meter = el('div', 'small', 'Buzzword meter: 0');
  answer.addEventListener('input', () => {
    meter.textContent = 'Buzzword meter: ' + buzzHits(answer.value).length + ' (the interviewer is counting)';
  });
  card.append(answer, meter);

  if (state.pressure) {
    const timerEl = el('div', 'timer', 'Time left: 1:30');
    card.appendChild(timerEl);
    let left = 90;
    timerId = setInterval(() => {
      left--;
      timerEl.textContent = 'Time left: ' + Math.floor(left / 60) + ':' + String(left % 60).padStart(2, '0');
      if (left <= 0) {
        clearTimer();
        timerEl.textContent = "Time's up. The interviewer is checking their watch.";
        timerEl.className = 'error';
      }
    }, 1000);
  }

  const submit = el('button', '', 'Submit answer');
  const out = el('div');

  submit.onclick = async () => {
    const text = answer.value.trim();
    out.innerHTML = '';

    if (text.length < 20) {
      out.appendChild(el('div', 'error', 'Two words is not an answer. Give it more.'));
      return;
    }

    clearTimer();
    submit.disabled = true;
    submit.textContent = 'Judging...';

    try {
      const r = await post('/api/grade', {
        posting: state.posting,
        costume: state.costume.voice,
        question: q,
        answer: text
      });
      state.scores.push(r.score);
      showResult(out, r, buzzHits(text).length);
    } catch (e) {
      out.appendChild(el('div', 'error', e.message));
      submit.disabled = false;
      submit.textContent = 'Submit answer';
    }
  };

  card.append(submit, out);
  stage.appendChild(card);
  answer.focus();
  card.scrollIntoView({ behavior: 'smooth' });
}

function showResult(out, r, buzz) {
  out.innerHTML = '';
  out.appendChild(el('div', 'score', r.score + ' / 6'));
  out.appendChild(el('div', r.verdict === 'pass' ? 'good' : 'bad',
    r.verdict === 'pass' ? '✅ Survived the round' : '❌ The interviewer is writing this down'));
  out.appendChild(el('p', '', r.reaction));
  out.appendChild(el('p', 'muted', 'Tip: ' + r.feedback));
  if (buzz) {
    out.appendChild(el('p', 'small', `You used ${buzz} buzzword${buzz > 1 ? 's' : ''}. Real interviewers hear that as a warning sign.`));
  }

  const last = state.idx === state.questions.length - 1;
  const next = el('button', '', last ? 'See the verdict 🎬' : 'Next question →');
  next.onclick = () => {
    if (last) {
      finish();
    } else {
      state.idx++;
      renderQuestion();
    }
  };
  out.appendChild(next);
}

function finish() {
  clearTimer();
  stage.innerHTML = '';
  const total = state.scores.reduce((a, b) => a + b, 0);
  const max = state.questions.length * 6;
  const passed = total >= max * (2 / 3);
  const c = state.costume;
  const company = state.company || 'our company';

  const card = el('div', 'card');
  card.appendChild(el('div', 'muted', c.emoji + ' ' + c.name + ' has made a decision'));
  card.appendChild(el('div', 'score', total + ' / ' + max));
  card.appendChild(el('h2', '', passed ? 'Offer letter (in character)' : 'Rejection letter (in character)'));
  card.appendChild(el('div', 'letter', (passed ? c.offer : c.reject).replace(/\{company\}/g, company)));

  if (state.prep.tips.length) {
    card.appendChild(el('div', 'label', 'Take these into the real interview'));
    const ul = el('ul');
    state.prep.tips.forEach(t => ul.appendChild(el('li', '', t)));
    card.appendChild(ul);
  }

  const row = el('div', 'row');
  const redo = el('button', 'ghost', 'Redo these questions 🔁');
  redo.onclick = () => {
    state.idx = 0;
    state.scores = [];
    renderQuestion();
  };
  const change = el('button', 'ghost', 'Change costume or job');
  change.onclick = () => {
    stage.innerHTML = '';
    state = null;
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };
  row.append(redo, change);
  card.appendChild(row);

  stage.appendChild(card);
  card.scrollIntoView({ behavior: 'smooth' });
}

renderCostumes();
</script>
</body>
</html>
