<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Custom Job Gauntlet</title>
<style>
:root{--bg:#0d1117;--card:#161b26;--ink:#f5f7fa;--muted:#9aa4b8;--accent:#ffcc00;--good:#3ddc97;--bad:#ff6b6b;--line:#2a3142}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:radial-gradient(circle at top,#1d2540,var(--bg) 60%);color:var(--ink);min-height:100vh;padding:24px}
.wrap{max-width:820px;margin:0 auto}
h1{font-size:2.1rem;margin:0 0 4px}
h2{font-size:1.4rem;margin:12px 0 6px}
.tag{color:var(--muted);margin:0 0 24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px}
textarea{width:100%;min-height:160px;resize:vertical;background:#0f131d;color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit;margin:8px 0}
button{background:var(--accent);color:#1a1400;border:0;border-radius:10px;padding:10px 16px;font-weight:700;font-size:.95rem;cursor:pointer;margin:6px 6px 0 0}
button:disabled{opacity:.6;cursor:default}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.bubble{background:#1f2636;padding:16px;border-radius:14px;line-height:1.5;font-size:1.05rem;border-left:4px solid var(--accent);margin-bottom:12px}
.score{font-size:2.4rem;font-weight:800;color:var(--accent);margin:10px 0 4px}
.good{color:var(--good);font-weight:600}
.bad{color:var(--bad);font-weight:600}
.muted{color:var(--muted);font-size:.9rem}
.error{color:var(--bad);margin-top:8px}
.hidden{display:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>📄 Custom Job Gauntlet</h1>
  <p class="tag">Paste a real job posting. The AI reads it and goes looking for your weak spots.</p>

  <div class="card">
    <label class="muted" for="posting">Job posting</label>
    <textarea id="posting" placeholder="Paste the full job description here..."></textarea>
    <button id="genBtn">Generate interview</button>
    <div id="intakeErr" class="error hidden"></div>
  </div>

  <div id="stage"></div>
</div>

<script>
const $ = id => document.getElementById(id);
const stage = $('stage');
let posting = '';
let questions = [];
let idx = 0;
let scores = [];

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
}

async function post(url, body) {
  const res = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || 'Something went wrong. The interviewer is on break.');
  return data;
}

function showIntakeError(msg) {
  const box = $('intakeErr');
  box.textContent = msg;
  box.classList.remove('hidden');
}

$('genBtn').onclick = async () => {
  const text = $('posting').value.trim();
  $('intakeErr').classList.add('hidden');

  if (text.length < 80) {
    showIntakeError('That is not a job posting, that is a sticky note. Paste the full description.');
    return;
  }

  const btn = $('genBtn');
  btn.disabled = true;
  btn.textContent = 'Reading the posting...';

  try {
    const data = await post('/api/questions', { posting: text });
    posting = text;
    questions = data.questions;
    idx = 0;
    scores = [];
    renderQuestion();
  } catch (e) {
    showIntakeError(e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = 'Generate interview';
  }
};

function renderQuestion() {
  stage.innerHTML = '';
  const card = el('div', 'card');
  card.appendChild(el('div', 'muted', `Question ${idx + 1} of ${questions.length}`));
  card.appendChild(el('div', 'bubble', questions[idx]));

  const answer = el('textarea');
  answer.placeholder = 'Answer like you actually want the job...';

  const submit = el('button', '', 'Submit answer');
  const out = el('div');

  submit.onclick = async () => {
    const text = answer.value.trim();
    out.innerHTML = '';

    if (text.length < 20) {
      out.appendChild(el('div', 'error', 'Two words is not an answer. Give it more.'));
      return;
    }

    submit.disabled = true;
    submit.textContent = 'Judging...';

    try {
      const r = await post('/api/grade', { posting, question: questions[idx], answer: text });
      scores.push(r.score);
      showResult(out, r);
    } catch (e) {
      out.appendChild(el('div', 'error', e.message));
      submit.disabled = false;
      submit.textContent = 'Submit answer';
    }
  };

  card.append(answer, submit, out);
  stage.appendChild(card);
  card.scrollIntoView({ behavior: 'smooth' });
}

function showResult(out, r) {
  out.innerHTML = '';
  out.appendChild(el('div', 'score', r.score + ' / 6'));
  out.appendChild(el('div', r.verdict === 'pass' ? 'good' : 'bad',
    r.verdict === 'pass' ? '✅ Strong answer' : '❌ Rejected'));
  out.appendChild(el('p', '', r.reaction));
  out.appendChild(el('p', 'muted', 'Tip: ' + r.feedback));

  const last = idx === questions.length - 1;
  const next = el('button', '', last ? 'See final verdict 🎬' : 'Next question →');
  next.onclick = () => {
    if (last) {
      finish();
    } else {
      idx++;
      renderQuestion();
    }
  };
  out.appendChild(next);
}

function finish() {
  stage.innerHTML = '';
  const total = scores.reduce((a, b) => a + b, 0);
  const max = questions.length * 6;
  const passed = total >= max * (4 / 6);

  const card = el('div', 'card');
  card.appendChild(el('div', 'score', total + ' / ' + max));
  card.appendChild(el('h2', '', passed ? 'Second round invite drafted' : 'Rejection email drafted'));
  card.appendChild(el('p', '', passed
    ? 'The hiring manager wants you back, possibly with less filler and more numbers.'
    : 'The hiring manager read your answers out loud at lunch. Nobody laughed kindly.'));

  const again = el('button', 'ghost', 'Try a different posting');
  again.onclick = () => {
    stage.innerHTML = '';
    $('posting').focus();
  };
  card.appendChild(again);
  stage.appendChild(card);
  card.scrollIntoView({ behavior: 'smooth' });
}
</script>
</body>
</html>
